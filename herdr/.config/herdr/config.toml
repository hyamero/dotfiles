onboarding = false
[theme]
name = "rose-pine"
auto_switch = false

[keys]
# Dedicated ISO key left of '1', never typed in code, so it avoids what ruled out
# ':' (eats ':w' in vim -> workspace_picker) and 'esc' (eats esc+hjkl -> focus_pane_*).
# Must stay unshifted: shift+§ emits '±', a distinct char, so "shift+§" never matches.
prefix = "§"

# Navigate mode (prefix+w): j/k walk workspaces, h/l stay on panes. Workspace
# moves take j/k, so pane up/down drop to the arrows. Navigate mode has no
# tab-movement action; tabs stay on prefix+p / prefix+n.
navigate_workspace_down = "j"
navigate_workspace_up = "k"
navigate_pane_down = "down"
navigate_pane_up = "up"

# Direct vim-style nav: h/l tabs, j/k workspaces (j/k follow the vertical sidebar).
# macOS only: ctrl+alt+h/j on WSL collide with alt+backspace / alt+newline.
# Cmd reaches herdr only via Ghostty keybinds that send CSI-u (see ghostty config).
previous_tab = "cmd+h"
next_tab = "cmd+l"
next_workspace = "cmd+j"
previous_workspace = "cmd+k"

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true

# Lets agents ping via `herdr notification show`; defaults to "off", which
# makes that call a silent no-op.
[ui.toast]
delivery = "system"
