onboarding = false
[theme]
name = "rose-pine"
auto_switch = false

[keys]
# Dedicated ISO key left of '1', never typed in code, so it avoids what ruled out
# ':' (eats ':w' in vim -> workspace_picker) and 'esc' (eats esc+hjkl -> focus_pane_*).
# Must stay unshifted: shift+§ emits '±', a distinct char, so "shift+§" never matches.
prefix = "§"

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true

# Lets agents ping via `herdr notification show`; defaults to "off", which
# makes that call a silent no-op.
[ui.toast]
delivery = "system"
